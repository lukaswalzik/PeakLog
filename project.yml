name: StrongTracker
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.5"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.3

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "15"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  StrongTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.5"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/ExerciseImages
        type: folder
    dependencies:
      - package: GRDB
        product: GRDB
      - target: StrongTrackerLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.strongtracker
        PRODUCT_NAME: StrongTracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/StrongTracker-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PeakLog
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "PeakLog benötigt Zugriff auf die Kamera, um Fotos für Übungen und Körperfortschritt aufzunehmen."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PeakLog benötigt Zugriff auf deine Fotos, um Bilder für Übungen und Körperfortschritt auszuwählen."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "PeakLog liest deine Live-Herzfrequenz, Körpergewicht sowie Aktivitäts- und Erholungsdaten aus Apple Health, um sie im Training anzuzeigen und zu speichern."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "PeakLog speichert abgeschlossene Kraft- und Cardio-Workouts auf Wunsch in Apple Health."
        CODE_SIGN_ENTITLEMENTS: Resources/StrongTracker.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  StrongTrackerLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.5"
    sources:
      - path: LiveActivityExtension
      - path: Sources/Shared/LiveActivity/WorkoutActivityAttributes.swift
      - path: Sources/Shared/LiveActivity/PeakLogWidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.strongtracker.liveactivity
        PRODUCT_NAME: StrongTrackerLiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/LiveActivity-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PeakLog Live
        CODE_SIGN_ENTITLEMENTS: Resources/LiveActivity.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
