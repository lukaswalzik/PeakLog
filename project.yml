name: StrongTracker
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.5"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.3

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  StrongTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.5"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/ExerciseImages
        type: folder
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.strongtracker
        PRODUCT_NAME: StrongTracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StrongTracker
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "StrongTracker benötigt Zugriff auf die Kamera, um Fotos für Übungen und Körperfortschritt aufzunehmen."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "StrongTracker benötigt Zugriff auf deine Fotos, um Bilder für Übungen und Körperfortschritt auszuwählen."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "StrongTracker liest deine Live-Herzfrequenz, Körpergewicht sowie Aktivitäts- und Erholungsdaten aus Apple Health, um sie im Training anzuzeigen und zu speichern."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "StrongTracker speichert abgeschlossene Kraft- und Cardio-Workouts auf Wunsch in Apple Health."
        CODE_SIGN_ENTITLEMENTS: Resources/StrongTracker.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
