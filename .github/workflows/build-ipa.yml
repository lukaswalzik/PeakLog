name: Build Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Release app for iphoneos
        run: |
          xcodebuild \
            -project StrongTracker.xcodeproj \
            -scheme StrongTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Embed HealthKit entitlements (ad-hoc sign for TrollStore)
        run: |
          codesign --force --sign - \
            --entitlements Resources/StrongTracker.entitlements \
            --timestamp=none \
            build/Build/Products/Release-iphoneos/StrongTracker.app
          codesign -d --entitlements :- build/Build/Products/Release-iphoneos/StrongTracker.app

      - name: Package StrongTracker.ipa
        run: |
          rm -rf Payload StrongTracker.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StrongTracker.app Payload/
          zip -r StrongTracker.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrongTracker-ipa
          path: StrongTracker.ipa
          if-no-files-found: error
